spring.application.name=Infoeduka

# ---------------------------------------------------------------------------
# Baza podataka - PostgreSQL
# Baza se mora rucno kreirati prije prvog pokretanja:
#   CREATE DATABASE pra_projekt WITH ENCODING 'UTF8';
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/pra_projekt
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# "update" znaci da Hibernate sam kreira i nadopunjuje tablice prema entitetima.
# Za produkciju bi islo "validate" + migracijska skripta, ali za projektni
# zadatak je ovo dovoljno i puno brze za razvoj.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Web posluzitelj i sesija
# Prijava se pamti u HttpSession-u, session cookie traje 60 minuta neaktivnosti.
# ---------------------------------------------------------------------------
server.port=8080
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=INFOEDUKA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------------------------------------------------------------------------
# JSON (Jackson)
# Jackson 3 (koji dolazi sa Spring Bootom 4) datume iz java.time vec po defaultu
# serijalizira u ISO-8601 tekst ("2026-08-28"), pa to ne treba posebno namjestati.
# Prazna polja saljemo kao null, sto frontend ocekuje.
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=always

# ---------------------------------------------------------------------------
# Pocetni podaci - ako je true, pri pokretanju se ubacuje demo sadrzaj
# (admin racun, par predavaca, kolegija i obavijesti) ako je baza prazna.
# ---------------------------------------------------------------------------
infoeduka.ucitaj-pocetne-podatke=true
infoeduka.admin.email=admin@algebra.hr
infoeduka.admin.lozinka=admin123

logging.level.hr.algebra.pra=INFO
